[SENTINEL - Autonomous Webhook Forwarder]
action.webhook.enable_allowlist = 0
action.webhook = 1
action.webhook.param.url = http://localhost:8000/api/v1/webhook/splunk
alert.suppress = 0
alert.track = 0
counttype = number of events
cron_schedule = * * * * *
description = Forwards all critical security events to SENTINEL agents
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=security_* severity=critical
